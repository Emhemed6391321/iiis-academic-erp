<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#14268d" />
      <stop offset="100%" stop-color="#091442" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Inner Concentric Circle -->
  <circle cx="256" cy="256" r="168" fill="#081028" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Top Text Path Curved: دولة ليبيا • الهيئة العامة للأوقاف والشؤون الإسلامية -->
  <path id="topArc" d="M 68 256 A 188 188 0 0 1 444 256" fill="none" />
  <text font-family="'Cairo', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="14.5" font-weight="900" fill="#fef08a" letter-spacing="1">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      دولة ليبيا • الهيئة العامة للأوقاف والشؤون الإسلامية
    </textPath>
  </text>

  <!-- Bottom Text Path Curved: إدارة التعليم الأصيل • المعهد المتوسط للدراسات الإسلامية -->
  <path id="bottomArc" d="M 444 256 A 188 188 0 0 1 68 256" fill="none" />
  <text font-family="'Cairo', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="900" fill="#fef08a" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      إدارة التعليم الأصيل • المعهد المتوسط للدراسات الإسلامية
    </textPath>
  </text>

  <!-- Side Decorative Stars -->
  <g transform="translate(52, 256) scale(1.2)">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="url(#goldGrad)" />
  </g>
  <g transform="translate(460, 256) scale(1.2)">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="url(#goldGrad)" />
  </g>

  <!-- Center Artwork: Mosque Dome & Crescent Motif -->
  <!-- Dome silhouette -->
  <path d="M 206 200 C 206 140, 256 120, 256 120 C 256 120, 306 140, 306 200 Z" fill="url(#tealGrad)" opacity="0.35"/>
  <path d="M 216 200 C 216 150, 256 130, 256 130 C 256 130, 296 150, 296 200 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Crescent on Top of Dome -->
  <path d="M 256 102 A 12 12 0 1 1 248 124 A 10 10 0 1 0 256 102 Z" fill="url(#goldGrad)"/>
  <circle cx="256" cy="98" r="2.5" fill="#fef08a"/>

  <!-- Minarets silhouettes -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" fill="url(#goldGrad)" opacity="0.8">
    <!-- Left Minaret -->
    <path d="M 180 220 L 180 155 L 184 150 L 184 140 L 182 140 L 182 135 L 184 135 L 184 130 L 182 125 L 182 122 L 184 122 L 182 118 L 182 220 Z"/>
    <!-- Right Minaret -->
    <path d="M 332 220 L 332 155 L 328 150 L 328 140 L 330 140 L 330 135 L 328 135 L 328 130 L 330 125 L 330 122 L 328 122 L 330 118 L 330 220 Z"/>
  </g>

  <!-- Open Holy Book (المصحف الشريف) in Center -->
  <g transform="translate(256, 250) scale(1.15)">
    <!-- Book Shadow -->
    <path d="M -70 20 C -40 30, -10 15, 0 24 C 10 15, 40 30, 70 20 L 65 5 C 35 15, 10 0, 0 10 C -10 0, -35 15, -65 5 Z" fill="#000000" opacity="0.5"/>
    
    <!-- Base / Stand (الرحلة) -->
    <polygon points="-35,38 0,18 35,38 25,44 0,28 -25,44" fill="url(#goldGrad)"/>
    <polygon points="-28,42 0,22 28,42 22,46 0,30 -22,46" fill="#78350f"/>

    <!-- Pages Base Layers -->
    <path d="M -68 18 C -40 28, -8 14, 0 22 C 8 14, 40 28, 68 18 L 65 3 C 38 13, 8 -1, 0 8 C -8 -1, -38 13, -65 3 Z" fill="#b45309"/>
    <path d="M -66 16 C -38 26, -6 12, 0 20 C 6 12, 38 26, 66 16 L 63 1 C 36 11, 6 -3, 0 6 C -6 -3, -36 11, -63 1 Z" fill="#fef3c7"/>

    <!-- Top Open Pages -->
    <path d="M -64 12 C -36 22, -4 8, 0 16 C 4 8, 36 22, 64 12 L 60 -5 C 34 5, 4 -9, 0 -1 C -4 -9, -34 5, -60 -5 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Lines of Calligraphy (Text Lines representation) -->
    <path d="M -50 0 C -35 7, -15 -1, -5 4 M -50 5 C -35 12, -15 4, -5 9 M -50 10 C -35 17, -15 9, -5 14" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 50 0 C 35 7, 15 -1, 5 4 M 50 5 C 35 12, 15 4, 5 9 M 50 10 C 35 17, 15 9, 5 14" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Ribbon / Banner below Book -->
  <g transform="translate(256, 335)">
    <path d="M -90 -4 L -115 -14 L -105 4 L -115 22 L -90 12 Z" fill="#92400e" />
    <path d="M 90 -4 L 115 -14 L 105 4 L 115 22 L 90 12 Z" fill="#92400e" />
    <path d="M -95 0 C -45 14, 45 14, 95 0 L 85 24 C 45 36, -45 36, -85 24 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
    <text x="0" y="19" font-family="'Cairo', 'Traditional Arabic', sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">
      وَقُل رَّبِّ زِدْنِي عِلْمًا
    </text>
  </g>

  <!-- Foundation Date: 1447 هـ - 2026 م -->
  <text x="256" y="388" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">
    تأسس سنة 1447 هـ • 2026 م
  </text>
</svg>
